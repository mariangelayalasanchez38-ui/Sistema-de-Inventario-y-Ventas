
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar venta | Sistema de Inventario y Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 650px;">
            <div class="card-header bg-primary text-white">
                <h1 class="h4 mb-0">Registrar nueva venta</h1>
            </div>

            <div class="card-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-info" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post" action="{% url 'crear_venta' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="cliente" class="form-label">
                            Nombre del cliente
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="cliente"
                            name="cliente"
                            maxlength="150"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="producto" class="form-label">
                            Seleccionar producto
                        </label>
                        <select
                            class="form-select"
                            id="producto"
                            name="producto"
                            required
                        >
                            <option value="">-- Selecciona un producto --</option>
                            {% for producto in productos %}
                                {% if producto.cantidad > 0 %}
                                    <option value="{{ producto.id }}">
                                        {{ producto.nombre }} — Precio: {{ producto.precio }} — Disponibles: {{ producto.cantidad }}
                                    </option>
                                {% endif %}
                            {% empty %}
                                <option value="">No hay productos registrados</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="cantidad" class="form-label">
                            Cantidad
                        </label>
                        <input
                            type="number"
                            class="form-control"
                            id="cantidad"
                            name="cantidad"
                            min="1"
                            step="1"
                            required
                        >
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-success">
                            Registrar venta
                        </button>
                        <a href="{% url 'ventas' %}" class="btn btn-secondary">
                            Volver a ventas
                        </a>
                        <a href="{% url 'inicio' %}" class="btn btn-outline-primary">
                            Volver al inicio
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
